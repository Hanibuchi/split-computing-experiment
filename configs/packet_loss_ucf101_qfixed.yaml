# =====================================================================
# scripts/packet_loss_sweep.py 用の設定: P フレームのステップ幅 q を固定する方式（q 固定）の評価
#   quick 設定（Gilbert-Elliott のロス）を base にして、モデル（efficientnet_v2_s / resnet50）・方式・ビット数を置き換える。
#
#   D+DZ は P フレームごとに差分の範囲 R = P99(|δ|) から q を決め直すので、差分が小さくても送信量はあまり減らない
#   （q も小さくなり、インデックスの分布の形が変わらないため）。q を I フレームの q に固定すると、差分が小さいほど
#   インデックスが 0 付近に集まって送信量が減る。ここでは次のことを調べる:
#     - D+DZ+QI の送信量と一致率を F+Sym / D+DZ と比べる（rate_vs_agreement.png）
#     - P フレームの飽和率（clamp_rate.png）と、パケットロスでの一致率の落ち方
#
#   条件が増えると実行時間がそのまま延びるので、方式は 3 つ・ビット数は 2/4/8 に絞っている。
#   ほかの比較をしたいときは、方式を足す（例）:
#     - {name: D+DZ+Cmax, scheme: dpcm, p_quant: dz, clip: max}                          # R = max|x|（クリップしない）
#     - {name: D+DZ+QI2, scheme: dpcm, p_quant: dz, p_step: intra, p_step_scale: 2.0}    # q = I フレームの q × 2
#     - {name: D+DZ+QI+PRS, scheme: dpcm, p_quant: dz, p_step: intra, prs: true, feedback_delay: 1}  # q 固定 + PRS
#
#   実行: python scripts/packet_loss_sweep.py --config configs/packet_loss_ucf101_qfixed.yaml
#   図:   python scripts/packet_loss_plot.py runs/packet_loss_ucf101_qfixed_<日時>
# =====================================================================

base: packet_loss_ucf101_quick.yaml
experiment_name: packet_loss_ucf101_qfixed

# quick 設定の resnet50 / vgg16 から vgg16 を efficientnet_v2_s に替える（list は丸ごと置き換わる）
targets:
  - {model: {name: efficientnet_v2_s, pretrained: true, trace_depth: 2}, split_point: features_4}   # S4: 128x14x14
  - {model: {name: resnet50, pretrained: true, trace_depth: 1}, split_point: layer2}                 # L2: 512x28x28

bits: [2, 4, 8]

schemes:
  - {name: F+Sym, scheme: fd, p_quant: sym}
  - {name: D+DZ, scheme: dpcm, p_quant: dz}
  - {name: D+DZ+QI, scheme: dpcm, p_quant: dz, p_step: intra}  # P フレームの q = I フレームの q
